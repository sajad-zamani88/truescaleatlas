<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3e8cf" />
    <title>TrueScale Atlas — Compare countries at their true size</title>
    <meta
      name="description"
      content="A free interactive world map for comparing countries and territories at their true geographic scale. Drag outlines across latitudes and read the distortion."
    />
    <meta
      name="keywords"
      content="true size, country size comparison, world map, Mercator projection, geography, map scale"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrueScale Atlas" />
    <meta
      property="og:title"
      content="TrueScale Atlas — Compare countries at their true size"
    />
    <meta
      property="og:description"
      content="Add countries and territories to a living survey map, drag them across latitudes, and compare their real footprints on one common scale."
    />
    <meta
      property="og:image"
      content="https://files.manuscdn.com/user_upload_by_module/session_file/310519664078932132/BUOalKccdCfPvKKn.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="TrueScale Atlas survey map with an open field-note card explaining true geographic scale."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="TrueScale Atlas — Compare countries at their true size"
    />
    <meta
      name="twitter:description"
      content="Add countries and territories to a living survey map, drag them across latitudes, and compare their real footprints on one common scale."

      name="twitter:image"

    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f3e8cf;
        color: #1f2b26;
        font-family: 'Source Sans 3', 'Helvetica Neue', sans-serif;
      }
      .boot-fallback {
        display: grid;
        min-height: 100vh;
        padding: 32px;
        place-items: center;
        text-align: center;
      }
      .boot-fallback > div {
        max-width: 560px;
      }
      .boot-fallback p {
        color: #5a655d;
        font-size: 17px;
        line-height: 1.5;
      }
      .boot-fallback h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: clamp(38px, 8vw, 72px);
        font-weight: 600;
        letter-spacing: -0.04em;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-fallback">
        <div>
          <h1>TrueScale Atlas</h1>
          <p>
            Compare countries and territories at their true geographic size on
            an interactive world map. Add outlines, drag them across latitudes,
            and inspect the real scale relationships hidden by map distortion.
          </p>
          <noscript>
            <p>This interactive atlas needs JavaScript enabled.</p>
          </noscript>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
